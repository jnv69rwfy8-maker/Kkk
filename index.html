<style>

.card{margin:0 0 14px;backdrop-filter:none;-webkit-backdrop-filter:none}

.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);border-radius:22px;padding:16px;box-shadow:var(--sh)}

.bars{display:flex;gap:6px;align-items:flex-end;height:120px;text-align:center}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}

.oled{font:800 26vw Inter,sans-serif}
#toast{position:fixed;bottom:110px;inset-inline:20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px;border-radius:14px;text-align:center;display:none;z-index:40}
.beam{height:10px;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:5px;transition:transform .5s;margin:30px 0}
canvas{width:100%;height:100px;display:block}
#dock{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));inset-inline:12px;max-width:520px;margin:0 auto;display:flex;gap:4px;padding:7px;border-radius:26px;background:var(--dk);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--bd);box-shadow:var(--sh);z-index:20}
#dock button{flex:1;border:0;background:none;border-radius:19px;display:flex;flex-direction:column;align-items:center;padding:5px 2px;color:var(--m);font-size:11px;line-height:1.3;box-shadow:none}
#dock button span{font-size:22px}
#dock button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
#sc{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top)}
.hero h1{font:700 32px/1.5 system-ui,system-ui,serif;color:var(--t);text-shadow:0 2px 14px rgba(var(--ar),.35)}
h2,#dock button,summary{font-family:system-ui,system-ui,sans-serif}
h2{font-weight:700;font-size:20px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.card{position:relative}
.card::before{content:'✦';position:absolute;top:8px;left:14px;color:var(--p);opacity:.35;font-size:13px}
.orn{display:flex;align-items:center;gap:10px;color:var(--p);margin:6px 0 2px}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--p),transparent)}
.noo .orn,.noo .card::before,.noo h2::after{display:none}
.nb .card,.nb #dock{backdrop-filter:none;-webkit-backdrop-filter:none}
details{border:1px solid var(--bd);border-radius:14px;margin:8px 0;padding:4px 12px;background:rgba(var(--pr),.05)}
summary{font-weight:700;font-size:16px;cursor:pointer;padding:8px 0}
#dt div{line-height:1.7}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tiles>div{background:rgba(var(--pr),.1);border:1px solid var(--bd);border-radius:16px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.4;color:var(--m)}
.tiles i{font-style:normal;display:block;font-size:20px}
.tiles b{display:block;font:800 28px Inter,system-ui,sans-serif;color:var(--p)}
.cc{display:flex;align-items:center;gap:14px}
.ccs{flex:1;display:grid;gap:6px}
.ccs>div{background:rgba(var(--pr),.1);border-radius:12px;padding:6px 10px;font-size:13px;color:var(--m);display:flex;align-items:center;gap:8px}
.ccs b{font:800 22px Inter,system-ui,sans-serif;color:var(--p);min-width:30px}
.nx{margin:6px 0 10px;padding:10px;border-radius:14px;border:1px dashed var(--bd)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tip{color:var(--m);font-size:14px;margin:10px 0 0}
.chip.on{background:var(--p);color:#fff}
.bars{gap:3px}.bars div{min-width:0}.bars small{font-size:10px;white-space:nowrap}.bars .dn{font-size:10.5px}
.fl.sm span{font-size:13vw;padding:1.5vw}.fl.sm em{font-size:8vw}
.pb{flex:1;height:8px;border-radius:4px;background:rgba(127,127,127,.25);overflow:hidden;min-width:40px}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:4px;transition:width .4s}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.cats button{padding:8px 4px;line-height:1.3}
.f small{color:#fff}
.grp{border:1px solid var(--bd);border-radius:16px;padding:8px 10px;margin:8px 0;background:rgba(var(--pr),.05)}
.sr{padding:4px 8px;border-radius:10px;margin:2px 0}.sr.cu{background:rgba(var(--pr),.22);font-weight:700}.sr.ps{opacity:.5}
.cur{font-size:18px;margin:8px 0 4px}.dep{text-align:center;margin:8px 0;padding:8px;border:1px dashed var(--bd);border-radius:12px}
.qt{font:700 19px/1.9 system-ui,sans-serif;text-align:center;padding:12px 10px;min-height:110px;letter-spacing:.05px}.qt span{display:block;color:var(--p);font:700 30px/1.2 Georgia,serif}

.section-subtitle{font:600 13px/1.8 system-ui,sans-serif;color:var(--m);margin:-5px 0 12px}
.hero .orn{font-family:system-ui,serif;letter-spacing:5px}
h2{letter-spacing:.1px}
h2 .ic{box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
button,select{transition:filter .18s ease,transform .18s ease,background .18s ease}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.card h2{padding-bottom:8px;border-bottom:1px solid var(--bd)}
#dock{padding-bottom:max(7px,env(safe-area-inset-bottom))}
.page-enter{animation:pageEnter .34s cubic-bezier(.2,.75,.25,1) both;transform-origin:50% 0}
@keyframes pageEnter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
.page-enter .card{animation:cardEnter .38s ease both}
@keyframes cardEnter{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.time-widget{position:relative;overflow:hidden;border:1px solid var(--bd);border-radius:20px;padding:14px;margin:12px 0;background:linear-gradient(135deg,rgba(var(--ar),.18),rgba(var(--pr),.055));box-shadow:var(--sh)}
.time-widget:after{content:'◷';position:absolute;left:8px;top:-22px;font:130px/1 Georgia,serif;color:var(--p);opacity:.09;pointer-events:none}
.tw-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.tw-time{font:700 clamp(34px,10vw,48px)/1.2 Inter,system-ui,sans-serif;letter-spacing:1px;color:var(--p);direction:ltr;text-align:center;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.tw-date{text-align:center;color:var(--m);font-size:13px;position:relative;z-index:1}
.tw-progress{height:7px;background:rgba(127,127,127,.2);border-radius:9px;overflow:hidden;margin:10px 0 5px;position:relative;z-index:1}
.tw-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:9px;transition:width .5s}
.tw-foot{display:flex;justify-content:space-between;gap:8px;color:var(--m);font-size:11px;position:relative;z-index:1}
.tw-actions{display:flex;gap:6px;justify-content:center;position:relative;z-index:1}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Unified readable ornamental typography across the entire app */
:root{--font-body:system-ui,Tahoma,sans-serif;--font-display:system-ui,system-ui,sans-serif;--font-accent:system-ui,system-ui,serif}
body,#app,.card,.card p,.card label,.card small,.card li,.card div,.card span,.card strong,.card em,.card td,.card th,.card input,.card textarea,.card select,.card button,#dock button,.top button,.sv,.page-kicker,.chip,.tip,.em,summary{font-family:var(--font-body)}
body{font-size:15.5px;line-height:1.85;letter-spacing:0;word-spacing:.12em;text-rendering:optimizeLegibility}
.hero h1{font-family:var(--font-accent);font-weight:700;letter-spacing:0;word-spacing:.16em;line-height:1.55}
h2,.card h2,.card h3,.place-card h3,.place-detail h3,.metro-brand b,.time-widget b,.orn,.qa button,.place-actions button,summary,#dock button{font-family:var(--font-display);font-weight:700;letter-spacing:0;word-spacing:.12em}
h2,.card h2{font-size:19px;line-height:1.8}
.card h3,.place-card h3{font-size:16px;line-height:1.8}
.card p,.card label,.card small,.card li,.card .tip,.card .em{font-size:14px;line-height:1.95}
button,select{font-family:var(--font-display);font-weight:700;letter-spacing:0;line-height:1.7}
input,textarea{font-family:var(--font-body);font-size:15px;line-height:1.8}
input::placeholder,textarea::placeholder{font-family:var(--font-body);opacity:.72}
#dock button{font-size:11px;line-height:1.7}
.page-kicker{font-family:var(--font-display);font-weight:600;letter-spacing:.2px;line-height:1.8}
.orn{font-size:14px;line-height:2}
.chip{font-weight:700;line-height:1.8}
/* Keep Latin labels elegant without squeezing Arabic glyphs */
.wm,.side-watermark,.tw-time,.n,.big,.oled,.fl span{font-variant-numeric:tabular-nums}
.wm #wmn{letter-spacing:1.8px;word-spacing:.22em}
.side-watermark{letter-spacing:4px;word-spacing:.2em}
.card h2 .ic{font-family:var(--font-body)}
.card .qt{font-family:var(--font-accent);font-size:23px;line-height:2.05;letter-spacing:0;word-spacing:.18em}
.card .page-kicker,.card .chip,.card .place-actions button{letter-spacing:0}
@media(max-width:390px){body{font-size:15px}.hero h1{font-size:29px}.card h2{font-size:18px}.card p,.card label,.card small{font-size:13.5px}}

/* Personal maker watermark: restrained signature, not decorative name text */
.wm{gap:7px;letter-spacing:0;color:var(--m);font-family:var(--font-body);font-size:12px;font-weight:600}
.wm #wmn{display:inline-block;font-family:var(--font-accent);font-size:16px;font-weight:700;letter-spacing:0;word-spacing:.08em;color:var(--p);text-shadow:none;padding:3px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--card)}
.side-watermark{right:5px;top:auto;bottom:19%;writing-mode:vertical-rl;transform:none;font-family:var(--font-accent);font-size:12px;font-weight:700;letter-spacing:0;word-spacing:.2em;color:var(--p);opacity:.22;text-shadow:none;border-right:1px solid var(--p);padding:8px 5px 8px 0}
@media(max-width:420px){.wm #wmn{font-size:14px;padding:2px 6px}.side-watermark{font-size:10px;right:2px;opacity:.18}}

.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tc{display:flex;flex-direction:column;gap:2px;text-align:right;align-items:flex-start;border:1px solid var(--bd);border-radius:17px;padding:12px;background:rgba(var(--pr),.055)}.tc b{font:700 15px system-ui,sans-serif}.tc small{font-size:11.5px;line-height:1.6;color:var(--m)}.tc .ti{font-size:24px}
.mcard{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);border-radius:19px;padding:12px;margin:10px 0;background:linear-gradient(145deg,rgba(var(--ar),.2),rgba(var(--pr),.07))}.mcard>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}.mcard b{font:700 18px system-ui,system-ui,sans-serif}.mcard small{color:var(--m)}
a.lk{font:700 12px system-ui,sans-serif;color:var(--p);text-decoration:none;border:1px solid var(--bd);border-radius:12px;padding:6px 10px}
.mapbox{height:min(62vh,420px);border:1px solid var(--bd);border-radius:17px;overflow:hidden;margin:8px 0;background:rgba(var(--pr),.06)}.mapbox .leaflet-container{height:100%;font-family:system-ui,sans-serif}
.pin{background:none;border:0}.pin i{display:block;width:22px;height:22px;margin:2px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#0E9AA7;border:2px solid #EEF5F4;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.ww{position:relative;width:min(86vw,340px);margin:22px auto 10px}.ww canvas{width:100%;height:auto;aspect-ratio:1;display:block;border-radius:50%;box-shadow:var(--sh)}
.wp{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid var(--t);z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.wb{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;padding:0;font-size:14px;border:4px solid #EEF5F4;z-index:2}.wb:active{transform:translate(-50%,-50%) scale(.95)}
.cf{position:absolute;pointer-events:none;font-size:16px;animation:cfly 1.2s ease-out forwards}@keyframes cfly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
